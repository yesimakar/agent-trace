services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-trace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agenttrace
      POSTGRES_PASSWORD: agenttrace
      POSTGRES_DB: agenttrace
    ports:
      - "5432:5432"
    volumes:
      - agent_trace_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenttrace -d agenttrace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agent_trace_postgres_data:
