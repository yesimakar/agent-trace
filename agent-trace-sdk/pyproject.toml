[project]
name = "agent-trace-sdk"
version = "0.1.0"
description = "Python SDK for emitting AI-agent execution traces to AgentTrace API."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
